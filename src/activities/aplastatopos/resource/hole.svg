<svg width="240" height="160" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Elderly-friendly build: new activity, hand-drawn to match the app's sober palette.
       The dark opening ellipse below is at a known position/size (cx120 cy88 rx66 ry28)
       so HoleSlot.qml can align its mole "emerging" clip window exactly on top of it. -->
  <defs>
    <radialGradient id="dirt" cx="45%" cy="30%" r="80%">
      <stop offset="0" stop-color="#A3814F"/>
      <stop offset="1" stop-color="#7A5B3A"/>
    </radialGradient>
    <radialGradient id="opening" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#4A3722"/>
      <stop offset="0.7" stop-color="#241809"/>
      <stop offset="1" stop-color="#120c05"/>
    </radialGradient>
  </defs>

  <!-- irregular mound built from overlapping blobs, more organic than a single ellipse -->
  <ellipse cx="120" cy="104" rx="116" ry="46" fill="url(#dirt)"/>
  <ellipse cx="55" cy="112" rx="38" ry="26" fill="#8E6D45"/>
  <ellipse cx="190" cy="110" rx="42" ry="28" fill="#8E6D45"/>
  <ellipse cx="120" cy="66" rx="76" ry="20" fill="#93714A"/>
  <ellipse cx="30" cy="118" rx="20" ry="14" fill="#6E5334"/>
  <ellipse cx="212" cy="114" rx="18" ry="13" fill="#6E5334"/>

  <!-- dirt clump texture -->
  <ellipse cx="42" cy="98" rx="7" ry="4" fill="#5F4A2E"/>
  <ellipse cx="196" cy="88" rx="8" ry="5" fill="#5F4A2E"/>
  <ellipse cx="70" cy="128" rx="6" ry="4" fill="#5F4A2E"/>
  <ellipse cx="168" cy="130" rx="7" ry="4" fill="#5F4A2E"/>
  <ellipse cx="120" cy="132" rx="9" ry="4" fill="#5F4A2E"/>

  <!-- little grass tufts around the rim -->
  <g fill="#7E9470">
    <path d="M20 108 q-4 -14 2 -20 q3 10 2 20 Z"/>
    <path d="M28 104 q0 -16 6 -20 q2 12 -1 21 Z"/>
    <path d="M222 100 q4 -14 -2 -20 q-3 10 -2 20 Z"/>
    <path d="M212 96 q0 -16 -6 -20 q-2 12 1 21 Z"/>
    <path d="M120 44 q-3 -12 1 -18 q4 8 3 18 Z"/>
    <path d="M128 44 q3 -12 -1 -18 q-4 8 -3 18 Z"/>
  </g>

  <!-- raised lip around the opening -->
  <ellipse cx="120" cy="80" rx="72" ry="12" fill="#B08F5E" opacity="0.55"/>

  <!-- the opening itself: keep at cx120 cy88 rx66 ry28 (see HoleSlot.qml) -->
  <ellipse cx="120" cy="88" rx="66" ry="28" fill="url(#opening)"/>
</svg>
